<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .login-box {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #1e293b;
    }

    .input-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #2563eb;
    }

    .show-password {
        display: flex;
        align-items: center;
        margin-top: 8px;
        gap: 8px;
        color: #475569;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #1d4ed8;
    }

    .error {
        color: #dc2626;
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
        display: none;
    }
</style>
</head>
<body>

<div class="login-box">

    <h1>Sign In</h1>

    <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <div class="show-password">
            <input type="checkbox" id="togglePassword" style="width:auto;">
            <label for="togglePassword" style="margin:0; cursor:pointer;">
                Show Password
            </label>
        </div>
    </div>

    <button onclick="login()">Sign In</button>

    <div class="error" id="errorMessage">
        womp womp wrong password
    </div>

</div>

<script>
    const CORRECT_PASSWORD = "schoolsux";

    document.getElementById("togglePassword").addEventListener("change", function() {
        const passwordField = document.getElementById("password");

        if (this.checked) {
            passwordField.type = "text";
        } else {
            passwordField.type = "password";
        }
    });

    function login() {
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("errorMessage");

        if (password === CORRECT_PASSWORD) {
            window.location.href = "history.html";
        } else {
            errorMessage.style.display = "block";
        }
    }

    document.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            login();
        }
    });
</script>

</body>
</html>
