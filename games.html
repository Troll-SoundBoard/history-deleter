<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#e5e5e5;
        padding:20px;
    }

    h1{
        text-align:center;
        margin-bottom:20px;
    }

    .search-box{
        display:flex;
        justify-content:center;
        margin-bottom:25px;
    }

    .search-box input{
        width:300px;
        max-width:90%;
        padding:12px;
        border:none;
        border-radius:20px;
        font-size:16px;
    }

    .games-container{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        gap:20px;
    }

    .game-card{
        background:white;
        border-radius:12px;
        overflow:hidden;
        text-decoration:none;
        color:black;
        transition:.2s;
        box-shadow:0 3px 10px rgba(0,0,0,.15);
    }

    .game-card:hover{
        transform:translateY(-5px);
    }

    .game-card img{
        width:100%;
        height:220px;
        object-fit:cover;
    }

    .game-title{
        padding:12px;
        text-align:center;
        font-weight:bold;
    }
</style>
</head>
<body>

<h1>Game Hub</h1>

<div class="search-box">
    <input type="text" id="search" placeholder="Search games...">
</div>

<div class="games-container" id="gamesContainer"></div>

<script>

/* =========================
   GAMES LIST
   Add new games here
   ========================= */

const games = [
    {
        title: "Drive Mad",
        thumbnail: "images/drivemad.png",
        file: "drivemad.html"
    },

    {
        title: "Portal",
        thumbnail: "images/portal.jpg",
        file: "portal.html"
    },

    {
        title: "Bomb Guy",
        thumbnail: "images/bombguy.png",
        file: "bombguy.html"
    }

    // Add more games below:
    /*
    ,
    {
        title: "Minecraft",
        thumbnail: "images/minecraft.png",
        file: "minecraft.html"
    }
    */
];

const container = document.getElementById("gamesContainer");

function displayGames(gameList){
    container.innerHTML = "";

    gameList.forEach(game=>{
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = game.file;

        card.innerHTML = `
            <img src="${game.thumbnail}" alt="${game.title}">
            <div class="game-title">${game.title}</div>
        `;

        container.appendChild(card);
    });
}

displayGames(games);

document.getElementById("search").addEventListener("input", function(){
    const search = this.value.toLowerCase();

    const filtered = games.filter(game =>
        game.title.toLowerCase().includes(search)
    );

    displayGames(filtered);
});

</script>

</body>
</html>
